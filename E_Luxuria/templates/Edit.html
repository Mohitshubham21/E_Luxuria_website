<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="img/favicon.ico" rel="icon">
    

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet"> 

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="stylesheet" href="{% static 'css/style3.css' %}">

    <style>
      #exampleDatepicker1{
        height: 30px; width: 400px;
      }
      .signup{
        background-image: url({% static 'img/signup1.jpg' %});
      }
    </style>
</head>
<body>
  <section class="h-200 signup" >
    <div class="container py-5">
      <div class="row d-flex justify-content-center align-items-center">
        <div class="col-lg-6 col-xl-6">
          <div class="card rounded-3" style="height: 500px;">
            
            <div class="card-body p-3 p-md-0" style="height: 500px;">
              <form method="POST" action="{% url 'update' %}" 
              enctype="multipart/form-data">
              <h3 class="mb-4 pb-2 pb-md-0 mb-md-1 px-md-1">Update User Information</h3>
              
  
              <form class="px-md-2 text-dark " method="POST" action="{% url 'Signup' %}">
                 {% csrf_token %}
  
                 <div class="form-outline mb-2 ">
                  <label class="form-label" for="form3Example1q">Name</label>
                  <input type="text" name="name" value={{user.name}} id="form3Example1q" class="form-control" style="height: 30px; width: 400px;" />
                </div>
  
                <div class="row">
                  <div class="col-md-10 mb-1">

                    <div class="form-outline Email">
                      <label for="exampleDatepicker1" class="form-label">Email</label>
                      <input type="text" name="email" value={{user.email}} class="form-control"  id="exampleDatepicker1" />
                      <input type="hidden" name="edit_id" value={{user.id}}>                   
                    </div>
                    <br>

                    <div class="row">
                      <div class="col mb-0 ">
                        <label for="exampleDatepicker1" class="form-label">Password</label>
                        <input type="text" name="Password" value={{user.Password}} class="form-control" style="height: 30px; width: 170px;" placeholder="">
                      </div>
                      <div class="col mb-0">
                        <label for="exampleDatepicker1" class="form-label">Confirm Password</label>
                        <input type="text" name="Confirm_Password" value={{user.Password}} class="form-control" style="height: 30px; width: 170px;" placeholder="">
                      </div>
                    </div>
                    
                  <br>
                   <div class="row">
                      <div class="col mb-0">
                        <label for="exampleDatepicker1" class="form-label">Address</label>
                        <input type="text" name="Address" value={{user.Address}} class="form-control" style="height: 30px; width: 170px;" placeholder="">
                      </div>
                      <div class="col mb-0">
                        <label for="exampleDatepicker1" class="form-label">Mobile No.</label>
                        <input type="text" name="Mobile_No" value={{user.Mobile_No}} class="form-control" style="height: 30px; width: 170px;" placeholder="">
                      </div>
                    </div> 
                    <br>
                  </div>
                   <div class="col-md-8 mb-0">
  
                    <select class="select" name="Gender" value={{user.Gender}}>
                      <option value="1">Gender</option>
                      <option value="2">Female</option>
                      <option value="3">Male</option>
                      <option value="4">Other</option>
                    </select>

                    <select class="select" name="Country" value={{user.Country}}>
                      <option value="1">Country</option>
                      <option value="2">Class 1</option>
                      <option value="3">Class 2</option>
                      <option value="4">Class 3</option>
                    </select>
  
                    <select class="select" name="State" value={{user.State}}>
                      <option value="1">State</option>
                      <option value="2">Class 1</option>
                      <option value="3">Class 2</option>
                      <option value="4">Class 3</option>
                    </select>
                    
                    </div>
                   
                  
                </div>
  
                
                <div class="row mb-0 pb-2 pb-md-0 mb-md-4">
                  <div class="col-md-4">
  
                    <div class="form-outline">
                      <label class="form-label" for="form3Example1w">PIN code</label>
                      <input type="text" name="PIN" value={{user.PIN}} id="form3Example1w" class="" style="height: 30px; width: 150px;" />
                      
                    </div>
                  </div>
                  <input style="height: 35px; width: 140px; margin-top: 30px; margin-left: 67px; background-color:darkolivegreen;" type="submit" value="update"/>
                </div>
  
                
  
              </form>
  
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
